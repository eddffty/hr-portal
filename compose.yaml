services:
  postgres:
    image: postgres:17
    container_name: hrportal-postgres
    environment:
      POSTGRES_DB: hrportal
      POSTGRES_USER: hrportal
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hrportal_local}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - hrportal-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrportal -d hrportal"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
volumes:
  hrportal-data:
    name: hrportal-data
