spring.application.name=hr-portal
server.address=127.0.0.1
server.port=8080
server.servlet.session.timeout=2h
server.error.include-message=always
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/hrportal}
spring.datasource.username=${DB_USERNAME:hrportal}
spring.datasource.password=${DB_PASSWORD:hrportal_local}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
portal.demo-data=${DEMO_DATA:true}
